name = "cosmossian"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# the app and its data, images and textures
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api/*"]

# custom domain (DNS for cosmossian.com must be on Cloudflare, which it is)
routes = [
  { pattern = "cosmossian.com", custom_domain = true },
  { pattern = "www.cosmossian.com", custom_domain = true }
]

# refresh live data every 3 hours (exoplanets daily, small bodies weekly)
[triggers]
crons = ["7 */3 * * *"]

# where the refreshed data is kept; create it once with:  npx wrangler kv namespace create LIVE
# then paste the id it prints below
[[kv_namespaces]]
binding = "LIVE"
id = "PASTE_THE_KV_ID_HERE"
